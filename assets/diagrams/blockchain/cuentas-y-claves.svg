<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="cuentas-y-claves-titulo cuentas-y-claves-desc">
<title id="cuentas-y-claves-titulo">De la clave privada a la dirección y los dos tipos de cuenta</title>
<desc id="cuentas-y-claves-desc">La clave privada genera la clave pública con la curva secp256k1; la dirección son los últimos 20 bytes del Keccak-256 de la clave pública. Solo la clave privada firma; cualquiera verifica la firma con la dirección. Una cuenta externa tiene clave privada e inicia transacciones; una cuenta de contrato tiene código y storage y solo actúa cuando la llaman.</desc>
<style>
text{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:12.5px}
.bg{fill:#f5f7f4}.card{fill:#fff;stroke:#dbe4da;stroke-width:1.5}.soft{fill:#e6f0e8;stroke:#17664f;stroke-width:1.6}
.bad-card{fill:#fdecea;stroke:#b42318;stroke-width:1.8}.zone{fill:none;stroke:#52655a;stroke-width:1.3;stroke-dasharray:6 5}
.t{fill:#243b32}.m{fill:#52655a}.a{fill:#17664f}.bad{fill:#b42318}.b{font-weight:650}.h{font-size:15px;font-weight:700}.s{font-size:11px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.ln{stroke:#52655a;stroke-width:1.6;fill:none}.ln-a{stroke:#17664f;stroke-width:2;fill:none}.ln-bad{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4;fill:none}
.mk{fill:#17664f}.mk-bad{fill:#b42318}
@media (prefers-color-scheme: dark){
.bg{fill:#10201a}.card{fill:#172a22;stroke:#2f4a3d}.soft{fill:#1d3a2f;stroke:#5fc9a1}.bad-card{fill:#3a1d1b;stroke:#ff8a80}.zone{stroke:#a9bdb1}
.t{fill:#e7f0ea}.m{fill:#a9bdb1}.a{fill:#5fc9a1}.bad{fill:#ff8a80}.ln{stroke:#a9bdb1}.ln-a{stroke:#5fc9a1}.ln-bad{stroke:#ff8a80}.mk{fill:#5fc9a1}.mk-bad{fill:#ff8a80}
}
</style>
<defs><marker id="f-cuentas-y-claves" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="x-cuentas-y-claves" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-bad"/></marker></defs>
<rect x="4" y="4" width="752" height="332" rx="16" class="bg"/><rect x="20" y="30" width="200" height="70" rx="10" class="bad-card"/><text x="34" y="58" class="b t">Clave privada</text><text x="34" y="82" class="m s">32 bytes secretos</text><rect x="280" y="30" width="200" height="70" rx="10" class="card"/><text x="294" y="58" class="b t">Clave pública</text><text x="294" y="82" class="m s">64 bytes</text><rect x="540" y="30" width="200" height="70" rx="10" class="soft"/><text x="554" y="58" class="b t">Dirección</text><text x="554" y="82" class="mono a">0xf39F…2266</text><line x1="220" y1="65" x2="278" y2="65" class="ln-a" marker-end="url(#f-cuentas-y-claves)"/><text x="249" y="56" class="s m" text-anchor="middle">secp256k1</text><line x1="480" y1="65" x2="538" y2="65" class="ln-a" marker-end="url(#f-cuentas-y-claves)"/><text x="509" y="56" class="s m" text-anchor="middle">Keccak-256</text><text x="509" y="118" class="s m" text-anchor="middle">últimos 20 bytes</text><text x="20" y="140" class="m">La clave privada firma; cualquiera verifica la firma contra la dirección. Nunca se comparte.</text><rect x="20" y="160" width="350" height="160" rx="10" class="card"/><text x="36" y="188" class="b a">Cuenta externa (EOA)</text><text x="36" y="216" class="t">• Tiene clave privada.</text><text x="36" y="242" class="t">• Inicia transacciones y paga el gas.</text><text x="36" y="268" class="t">• Su nonce cuenta las transacciones enviadas.</text><text x="36" y="294" class="t">• Ejemplo: tu billetera o el oráculo.</text><rect x="390" y="160" width="350" height="160" rx="10" class="card"/><text x="406" y="188" class="b a">Cuenta de contrato</text><text x="406" y="216" class="t">• No tiene clave privada.</text><text x="406" y="242" class="t">• Guarda código y storage.</text><text x="406" y="268" class="t">• Solo actúa cuando otra cuenta la llama.</text><text x="406" y="294" class="t">• Ejemplo: DineroProgramableBase.</text>
</svg>
