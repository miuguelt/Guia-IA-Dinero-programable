<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="anatomia-bloque-titulo anatomia-bloque-desc">
<title id="anatomia-bloque-titulo">Anatomía de un bloque de Ethereum</title>
<desc id="anatomia-bloque-desc">La cabecera resume el bloque en campos: número, hash del bloque anterior, marca de tiempo, raíces de estado, transacciones y recibos, gas y tarifa base. El cuerpo lista las transacciones. El hash del bloque se calcula sobre la cabecera y el bloque siguiente lo guarda como parentHash.</desc>
<style>
text{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:12.5px}
.bg{fill:#f5f7f4}.card{fill:#fff;stroke:#dbe4da;stroke-width:1.5}.soft{fill:#e6f0e8;stroke:#17664f;stroke-width:1.6}
.bad-card{fill:#fdecea;stroke:#b42318;stroke-width:1.8}.zone{fill:none;stroke:#52655a;stroke-width:1.3;stroke-dasharray:6 5}
.t{fill:#243b32}.m{fill:#52655a}.a{fill:#17664f}.bad{fill:#b42318}.b{font-weight:650}.h{font-size:15px;font-weight:700}.s{font-size:11px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.ln{stroke:#52655a;stroke-width:1.6;fill:none}.ln-a{stroke:#17664f;stroke-width:2;fill:none}.ln-bad{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4;fill:none}
.mk{fill:#17664f}.mk-bad{fill:#b42318}
@media (prefers-color-scheme: dark){
.bg{fill:#10201a}.card{fill:#172a22;stroke:#2f4a3d}.soft{fill:#1d3a2f;stroke:#5fc9a1}.bad-card{fill:#3a1d1b;stroke:#ff8a80}.zone{stroke:#a9bdb1}
.t{fill:#e7f0ea}.m{fill:#a9bdb1}.a{fill:#5fc9a1}.bad{fill:#ff8a80}.ln{stroke:#a9bdb1}.ln-a{stroke:#5fc9a1}.ln-bad{stroke:#ff8a80}.mk{fill:#5fc9a1}.mk-bad{fill:#ff8a80}
}
</style>
<defs><marker id="f-anatomia-bloque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="x-anatomia-bloque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-bad"/></marker></defs>
<rect x="20" y="20" width="720" height="380" rx="16" class="bg"/><text x="40" y="52" class="h t">Bloque 42</text><rect x="40" y="70" width="420" height="310" rx="10" class="card"/><text x="56" y="96" class="b a">Cabecera</text><text x="56" y="128" class="mono t">number</text><text x="205" y="128" class="m">posición en la cadena: 42</text><line x1="56" y1="140" x2="444" y2="140" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="160" class="mono t">parentHash</text><text x="205" y="160" class="m">hash del bloque 41</text><line x1="56" y1="172" x2="444" y2="172" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="192" class="mono t">timestamp</text><text x="205" y="192" class="m">segundos desde 1970</text><line x1="56" y1="204" x2="444" y2="204" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="224" class="mono t">stateRoot</text><text x="205" y="224" class="m">resumen de saldos y storage</text><line x1="56" y1="236" x2="444" y2="236" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="256" class="mono t">transactionsRoot</text><text x="205" y="256" class="m">resumen de las transacciones</text><line x1="56" y1="268" x2="444" y2="268" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="288" class="mono t">receiptsRoot</text><text x="205" y="288" class="m">resumen de recibos y logs</text><line x1="56" y1="300" x2="444" y2="300" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="320" class="mono t">gasUsed / gasLimit</text><text x="205" y="320" class="m">gas consumido / máximo</text><line x1="56" y1="332" x2="444" y2="332" class="zone" style="stroke-dasharray:2 4"/><text x="56" y="352" class="mono t">baseFeePerGas</text><text x="205" y="352" class="m">tarifa base por unidad de gas</text><rect x="490" y="70" width="230" height="186" rx="10" class="card"/><text x="506" y="96" class="b a">Cuerpo: transacciones</text><rect x="506" y="110" width="198" height="36" rx="8" class="soft"/><text x="518" y="133" class="mono a">tx 0</text><text x="560" y="133" class="mono t">depositarGarantia</text><rect x="506" y="156" width="198" height="36" rx="8" class="soft"/><text x="518" y="179" class="mono a">tx 1</text><text x="560" y="179" class="mono t">autorizarPago</text><rect x="506" y="202" width="198" height="36" rx="8" class="soft"/><text x="518" y="225" class="mono a">tx 2</text><text x="560" y="225" class="mono t">retirarMiDinero</text><rect x="490" y="280" width="230" height="100" rx="10" class="soft"/><text x="506" y="306" class="b t">hash del bloque 42</text><text x="506" y="328" class="mono a">Keccak-256(cabecera)</text><text x="506" y="352" class="m s">El bloque 43 lo guarda</text><text x="506" y="368" class="m s">como su parentHash.</text><line x1="460" y1="330" x2="486" y2="330" class="ln-a" marker-end="url(#f-anatomia-bloque)"/><path d="M460 252 C 474 252, 474 232, 486 232" class="ln" marker-end="url(#f-anatomia-bloque)"/>
</svg>
