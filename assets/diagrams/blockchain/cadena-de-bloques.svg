<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="cadena-de-bloques-titulo cadena-de-bloques-desc">
<title id="cadena-de-bloques-titulo">Cómo se encadenan los bloques y qué pasa al alterar uno</title>
<desc id="cadena-de-bloques-desc">Arriba, cuatro bloques íntegros: cada uno guarda como anterior el hash del bloque previo. Abajo, el bloque 1 cambió su contenido y se recalculó su hash; el bloque 2 todavía guarda el hash antiguo, así que el enlace se rompe y los bloques 2 y 3 dejan de ser válidos.</desc>
<style>
text{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:12.5px}
.bg{fill:#f5f7f4}.card{fill:#fff;stroke:#dbe4da;stroke-width:1.5}.soft{fill:#e6f0e8;stroke:#17664f;stroke-width:1.6}
.bad-card{fill:#fdecea;stroke:#b42318;stroke-width:1.8}.zone{fill:none;stroke:#52655a;stroke-width:1.3;stroke-dasharray:6 5}
.t{fill:#243b32}.m{fill:#52655a}.a{fill:#17664f}.bad{fill:#b42318}.b{font-weight:650}.h{font-size:15px;font-weight:700}.s{font-size:11px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.ln{stroke:#52655a;stroke-width:1.6;fill:none}.ln-a{stroke:#17664f;stroke-width:2;fill:none}.ln-bad{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4;fill:none}
.mk{fill:#17664f}.mk-bad{fill:#b42318}
@media (prefers-color-scheme: dark){
.bg{fill:#10201a}.card{fill:#172a22;stroke:#2f4a3d}.soft{fill:#1d3a2f;stroke:#5fc9a1}.bad-card{fill:#3a1d1b;stroke:#ff8a80}.zone{stroke:#a9bdb1}
.t{fill:#e7f0ea}.m{fill:#a9bdb1}.a{fill:#5fc9a1}.bad{fill:#ff8a80}.ln{stroke:#a9bdb1}.ln-a{stroke:#5fc9a1}.ln-bad{stroke:#ff8a80}.mk{fill:#5fc9a1}.mk-bad{fill:#ff8a80}
}
</style>
<defs><marker id="f-cadena-de-bloques" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="x-cadena-de-bloques" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-bad"/></marker></defs>
<rect x="4" y="4" width="752" height="412" rx="16" class="bg"/><text x="20" y="32" class="b t">Cadena íntegra: cada bloque guarda el hash del anterior</text><rect x="20" y="48" width="150" height="112" rx="10" class="card"/><text x="32" y="72" class="b t">Bloque 0</text><text x="32" y="94" class="m s">génesis</text><text x="32" y="118" class="m s">anterior</text><text x="86" y="118" class="mono t">0000…</text><text x="32" y="142" class="m s">hash</text><text x="86" y="142" class="mono t">0a1f…</text><line x1="170" y1="138" x2="208" y2="114" class="ln-a" marker-end="url(#f-cadena-de-bloques)"/><rect x="210" y="48" width="150" height="112" rx="10" class="card"/><text x="222" y="72" class="b t">Bloque 1</text><text x="222" y="94" class="m s">depósito 0,01</text><text x="222" y="118" class="m s">anterior</text><text x="276" y="118" class="mono t">0a1f…</text><text x="222" y="142" class="m s">hash</text><text x="276" y="142" class="mono t">7b3e…</text><line x1="360" y1="138" x2="398" y2="114" class="ln-a" marker-end="url(#f-cadena-de-bloques)"/><rect x="400" y="48" width="150" height="112" rx="10" class="card"/><text x="412" y="72" class="b t">Bloque 2</text><text x="412" y="94" class="m s">evaluación</text><text x="412" y="118" class="m s">anterior</text><text x="466" y="118" class="mono t">7b3e…</text><text x="412" y="142" class="m s">hash</text><text x="466" y="142" class="mono t">d25c…</text><line x1="550" y1="138" x2="588" y2="114" class="ln-a" marker-end="url(#f-cadena-de-bloques)"/><rect x="590" y="48" width="150" height="112" rx="10" class="card"/><text x="602" y="72" class="b t">Bloque 3</text><text x="602" y="94" class="m s">retiro</text><text x="602" y="118" class="m s">anterior</text><text x="656" y="118" class="mono t">d25c…</text><text x="602" y="142" class="m s">hash</text><text x="656" y="142" class="mono t">4e98…</text><text x="20" y="222" class="b bad">Bloque 1 alterado y recalculado: el enlace siguiente se rompe</text><rect x="20" y="238" width="150" height="112" rx="10" class="card"/><text x="32" y="262" class="b t">Bloque 0</text><text x="32" y="284" class="m s">génesis</text><text x="32" y="308" class="m s">anterior</text><text x="86" y="308" class="mono t">0000…</text><text x="32" y="332" class="m s">hash</text><text x="86" y="332" class="mono t">0a1f…</text><rect x="210" y="238" width="150" height="112" rx="10" class="soft"/><text x="222" y="262" class="b t">Bloque 1</text><text x="222" y="284" class="m s">depósito 9,00</text><text x="222" y="308" class="m s">anterior</text><text x="276" y="308" class="mono t">0a1f…</text><text x="222" y="332" class="m s">hash</text><text x="276" y="332" class="mono a">c90d…</text><rect x="400" y="238" width="150" height="112" rx="10" class="bad-card"/><text x="412" y="262" class="b t">Bloque 2</text><text x="412" y="284" class="m s">evaluación</text><text x="412" y="308" class="m s">anterior</text><text x="466" y="308" class="mono bad">7b3e…</text><text x="412" y="332" class="m s">hash</text><text x="466" y="332" class="mono t">d25c…</text><rect x="590" y="238" width="150" height="112" rx="10" class="bad-card"/><text x="602" y="262" class="b t">Bloque 3</text><text x="602" y="284" class="m s">retiro</text><text x="602" y="308" class="m s">anterior</text><text x="656" y="308" class="mono t">d25c…</text><text x="602" y="332" class="m s">hash</text><text x="656" y="332" class="mono t">4e98…</text><line x1="170" y1="328" x2="208" y2="304" class="ln-a" marker-end="url(#f-cadena-de-bloques)"/><line x1="360" y1="328" x2="398" y2="304" class="ln-bad" marker-end="url(#x-cadena-de-bloques)"/><line x1="550" y1="328" x2="588" y2="304" class="ln-bad" marker-end="url(#x-cadena-de-bloques)"/><text x="380" y="380" class="mono bad" text-anchor="middle">c90d… ≠ 7b3e…</text><text x="380" y="400" class="m s" text-anchor="middle">Para ocultarlo habría que recalcular todos los bloques siguientes en la mayoría de nodos.</text>
</svg>
