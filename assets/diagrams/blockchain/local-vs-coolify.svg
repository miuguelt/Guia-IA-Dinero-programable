<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="local-vs-coolify-titulo local-vs-coolify-desc">
<title id="local-vs-coolify-titulo">Conexión al nodo local frente al Anvil de Coolify</title>
<desc id="local-vs-coolify-desc">Desde tu PC hay dos caminos. El nodo local de Hardhat escucha en 127.0.0.1:8545 con chainId 31337 y crea un bloque por transacción. El Anvil del VPS se alcanza por HTTPS a través de Traefik, que exige Basic Auth y responde 401 sin credenciales; usa chainId 31338, produce un bloque cada 2 segundos y guarda su estado en el volumen anvil_data.</desc>
<style>
text{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:12.5px}
.bg{fill:#f5f7f4}.card{fill:#fff;stroke:#dbe4da;stroke-width:1.5}.soft{fill:#e6f0e8;stroke:#17664f;stroke-width:1.6}
.bad-card{fill:#fdecea;stroke:#b42318;stroke-width:1.8}.zone{fill:none;stroke:#52655a;stroke-width:1.3;stroke-dasharray:6 5}
.t{fill:#243b32}.m{fill:#52655a}.a{fill:#17664f}.bad{fill:#b42318}.b{font-weight:650}.h{font-size:15px;font-weight:700}.s{font-size:11px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.ln{stroke:#52655a;stroke-width:1.6;fill:none}.ln-a{stroke:#17664f;stroke-width:2;fill:none}.ln-bad{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4;fill:none}
.mk{fill:#17664f}.mk-bad{fill:#b42318}
@media (prefers-color-scheme: dark){
.bg{fill:#10201a}.card{fill:#172a22;stroke:#2f4a3d}.soft{fill:#1d3a2f;stroke:#5fc9a1}.bad-card{fill:#3a1d1b;stroke:#ff8a80}.zone{stroke:#a9bdb1}
.t{fill:#e7f0ea}.m{fill:#a9bdb1}.a{fill:#5fc9a1}.bad{fill:#ff8a80}.ln{stroke:#a9bdb1}.ln-a{stroke:#5fc9a1}.ln-bad{stroke:#ff8a80}.mk{fill:#5fc9a1}.mk-bad{fill:#ff8a80}
}
</style>
<defs><marker id="f-local-vs-coolify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="x-local-vs-coolify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-bad"/></marker></defs>
<rect x="4" y="4" width="752" height="402" rx="16" class="bg"/><rect x="20" y="30" width="150" height="356" rx="10" class="card"/><text x="36" y="58" class="h t">Tu PC</text><rect x="34" y="78" width="122" height="36" rx="8" class="soft"/><text x="95" y="101" class="mono a" text-anchor="middle">Hardhat</text><rect x="34" y="128" width="122" height="36" rx="8" class="soft"/><text x="95" y="151" class="mono a" text-anchor="middle">red:verificar</text><rect x="34" y="178" width="122" height="36" rx="8" class="soft"/><text x="95" y="201" class="mono a" text-anchor="middle">MetaMask</text><text x="36" y="262" class="m s">Elige la red con</text><text x="36" y="278" class="mono m">--network o --red</text><rect x="260" y="30" width="470" height="120" rx="10" class="card"/><text x="276" y="58" class="b t">Nodo local · Hardhat</text><text x="276" y="84" class="mono a">chainId 31337 · cliente HardhatNetwork</text><text x="276" y="108" class="m">Crea un bloque por cada transacción.</text><text x="276" y="130" class="m">Solo escucha en tu equipo; el estado se pierde al cerrarlo.</text><line x1="170" y1="90" x2="258" y2="90" class="ln-a" marker-end="url(#f-local-vs-coolify)"/><text x="214" y="80" class="s m" text-anchor="middle">HTTP local</text><rect x="246" y="180" width="498" height="206" rx="12" class="zone"/><text x="262" y="204" class="b m">VPS con Coolify</text><rect x="262" y="222" width="138" height="140" rx="10" class="card"/><text x="274" y="246" class="b t">Traefik</text><text x="274" y="270" class="mono s t">rpc.tudominio.com</text><text x="274" y="294" class="m s">exige Basic Auth</text><text x="274" y="318" class="bad s">sin credenciales</text><text x="274" y="334" class="bad s">responde 401</text><rect x="450" y="222" width="140" height="140" rx="10" class="soft"/><text x="462" y="246" class="b t">Anvil</text><text x="462" y="270" class="mono a">chainId 31338</text><text x="462" y="294" class="m s">bloque cada 2 s</text><text x="462" y="318" class="m s">puerto 8545</text><text x="462" y="334" class="m s">solo interno</text><rect x="630" y="242" width="100" height="100" rx="10" class="card"/><text x="642" y="268" class="mono t">anvil_data</text><text x="642" y="292" class="m s">guarda el</text><text x="642" y="308" class="m s">estado cada</text><text x="642" y="324" class="m s">10 s</text><line x1="170" y1="290" x2="260" y2="290" class="ln-a" marker-end="url(#f-local-vs-coolify)"/><text x="214" y="280" class="s m" text-anchor="middle">HTTPS</text><text x="214" y="308" class="s m" text-anchor="middle">Basic Auth</text><line x1="400" y1="292" x2="448" y2="292" class="ln-a" marker-end="url(#f-local-vs-coolify)"/><text x="424" y="283" class="s m" text-anchor="middle">reenvía</text><line x1="590" y1="292" x2="628" y2="292" class="ln" marker-end="url(#f-local-vs-coolify)"/><text x="609" y="283" class="s m" text-anchor="middle">guarda</text>
</svg>
