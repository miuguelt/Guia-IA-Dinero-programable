<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 360" role="img" aria-labelledby="ciclo-transaccion-titulo ciclo-transaccion-desc">
<title id="ciclo-transaccion-titulo">Ciclo de vida de una transacción</title>
<desc id="ciclo-transaccion-desc">La billetera firma la transacción y la envía por JSON-RPC al nodo. La transacción espera en el mempool hasta que un productor la incluye en un bloque. La EVM ejecuta el contrato y genera un recibo con eventos. Un indexador lee esos eventos y los guarda en PostgreSQL para consultas rápidas.</desc>
<style>
text{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:12.5px}
.bg{fill:#f5f7f4}.card{fill:#fff;stroke:#dbe4da;stroke-width:1.5}.soft{fill:#e6f0e8;stroke:#17664f;stroke-width:1.6}
.bad-card{fill:#fdecea;stroke:#b42318;stroke-width:1.8}.zone{fill:none;stroke:#52655a;stroke-width:1.3;stroke-dasharray:6 5}
.t{fill:#243b32}.m{fill:#52655a}.a{fill:#17664f}.bad{fill:#b42318}.b{font-weight:650}.h{font-size:15px;font-weight:700}.s{font-size:11px}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11.5px}
.ln{stroke:#52655a;stroke-width:1.6;fill:none}.ln-a{stroke:#17664f;stroke-width:2;fill:none}.ln-bad{stroke:#b42318;stroke-width:2;stroke-dasharray:6 4;fill:none}
.mk{fill:#17664f}.mk-bad{fill:#b42318}
@media (prefers-color-scheme: dark){
.bg{fill:#10201a}.card{fill:#172a22;stroke:#2f4a3d}.soft{fill:#1d3a2f;stroke:#5fc9a1}.bad-card{fill:#3a1d1b;stroke:#ff8a80}.zone{stroke:#a9bdb1}
.t{fill:#e7f0ea}.m{fill:#a9bdb1}.a{fill:#5fc9a1}.bad{fill:#ff8a80}.ln{stroke:#a9bdb1}.ln-a{stroke:#5fc9a1}.ln-bad{stroke:#ff8a80}.mk{fill:#5fc9a1}.mk-bad{fill:#ff8a80}
}
</style>
<defs><marker id="f-ciclo-transaccion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="x-ciclo-transaccion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-bad"/></marker></defs>
<rect x="4" y="4" width="862" height="352" rx="16" class="bg"/><rect x="20" y="40" width="150" height="78" rx="10" class="card"/><text x="32" y="66" class="b t">1. Billetera</text><text x="32" y="92" class="m s">firma con su clave</text><rect x="245" y="40" width="150" height="78" rx="10" class="soft"/><text x="257" y="66" class="b t">2. Nodo RPC</text><text x="257" y="92" class="m s">valida firma y nonce</text><rect x="470" y="40" width="150" height="78" rx="10" class="soft"/><text x="482" y="66" class="b t">3. Mempool</text><text x="482" y="92" class="m s">espera su turno</text><rect x="695" y="40" width="150" height="78" rx="10" class="soft"/><text x="707" y="66" class="b t">4. Bloque</text><text x="707" y="92" class="m s">lo arma el productor</text><rect x="20" y="216" width="150" height="78" rx="10" class="card"/><text x="32" y="242" class="b t">8. PostgreSQL</text><text x="32" y="268" class="m s">consultas en ms</text><rect x="245" y="216" width="150" height="78" rx="10" class="card"/><text x="257" y="242" class="b t">7. Indexador</text><text x="257" y="268" class="m s">lee los eventos</text><rect x="470" y="216" width="150" height="78" rx="10" class="soft"/><text x="482" y="242" class="b t">6. Recibo y logs</text><text x="482" y="268" class="m s">status, gas, eventos</text><rect x="695" y="216" width="150" height="78" rx="10" class="soft"/><text x="707" y="242" class="b t">5. EVM</text><text x="707" y="268" class="m s">ejecuta el contrato</text><line x1="170" y1="79" x2="243" y2="79" class="ln-a" marker-end="url(#f-ciclo-transaccion)"/><text x="207.5" y="70" class="s m" text-anchor="middle">JSON-RPC</text><line x1="395" y1="79" x2="468" y2="79" class="ln-a" marker-end="url(#f-ciclo-transaccion)"/><text x="432.5" y="70" class="s m" text-anchor="middle">difunde</text><line x1="620" y1="79" x2="693" y2="79" class="ln-a" marker-end="url(#f-ciclo-transaccion)"/><text x="657.5" y="70" class="s m" text-anchor="middle">selecciona</text><line x1="770" y1="118" x2="770" y2="213" class="ln-a" marker-end="url(#f-ciclo-transaccion)"/><text x="780" y="170" class="s m">ejecuta</text><line x1="693" y1="255" x2="622" y2="255" class="ln-a" marker-end="url(#f-ciclo-transaccion)"/><text x="657.5" y="246" class="s m" text-anchor="middle">produce</text><line x1="468" y1="255" x2="397" y2="255" class="ln-a" marker-end="url(#f-ciclo-transaccion)"/><text x="432.5" y="246" class="s m" text-anchor="middle">emite</text><line x1="243" y1="255" x2="172" y2="255" class="ln" marker-end="url(#f-ciclo-transaccion)"/><text x="207.5" y="246" class="s m" text-anchor="middle">guarda</text><rect x="20" y="318" width="16" height="16" rx="4" class="soft"/><text x="44" y="331" class="s m">Ocurre en el nodo (on-chain)</text><rect x="250" y="318" width="16" height="16" rx="4" class="card"/><text x="274" y="331" class="s m">Ocurre fuera de la cadena (off-chain)</text>
</svg>
